[project]
name = "charge-grinder-esp32"
version = "0.1.3"
description = "Charge-Grinder-ESP32-Edition: Limbus Company bot driven through an ESP32-S3 USB HID device"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "PySide6>=6.7",
    "esptool>=4.7,<5",
    "pyserial>=3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host", "tests"]
