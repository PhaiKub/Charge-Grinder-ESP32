; Charge-Grinder-ESP32-Edition firmware (ESP32-S3, native USB).
;
; Build:   pio run
; Flash:   pio run -t upload            (board's COM/UART port)

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0          ; USB-OTG (TinyUSB), needed for HID
    -DARDUINO_USB_CDC_ON_BOOT=1   ; CDC serial on the native port
    -DFW_VERSION=\"0.1.0\"

[env:esp32s3-debug]
; Same firmware with ESP-IDF/Arduino logs on the UART (COM/CH340) port:
;   pio run -e esp32s3-debug -t upload
;   pio device monitor -p <COM port of the CH340> -b 115200
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DCORE_DEBUG_LEVEL=4

[env:native]
; Host-side unit tests for the protocol code (no board needed): pio test -e native
platform = native
test_build_src = no
build_flags = -std=c++17 -I src
