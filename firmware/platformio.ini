; Charge-Grinder-ESP32-Edition firmware (ESP32-S3 / ESP32-S2, native USB).
;
; Build every board:  pio run
; Build one board:    pio run -e esp32s3
; Flash from here:    pio run -e esp32s3 -t upload --upload-port COM6   (the board's COM/UART port)
;
; Each build also writes dist/<env>.bin, one image that the app flashes at 0x0
; (Device window > Flash Firmware), and dist/<env>.json with its version.
; Supported boards are listed for the app in host/cg_esp32/boards.py.

[platformio]
default_envs = esp32s3, lolin_s2_mini

[fw]
version = 0.2.0

[esp32_common]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_bin.py
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DARDUINO_USB_MODE=0          ; USB-OTG (TinyUSB), needed for HID
    -DARDUINO_USB_CDC_ON_BOOT=1   ; CDC serial on the native port
    -DFW_VERSION=\"${fw.version}\"

[env:esp32s3]
; ESP32-S3 DevKitC-1 and most ESP32-S3 boards with a native USB port.
; Status LED: WS2812 on GPIO 48.
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_common.build_flags}
    -DFW_BOARD=\"esp32s3\"         ; = env name, reported in HELLO
    -DLED_PIN=48
    -DLED_RGB=1

[env:lolin_s2_mini]
; WEMOS/LOLIN S2 Mini (ESP32-S2, one USB-C port = native USB).
; Status LED: plain blue LED on GPIO 15.
extends = esp32_common
board = lolin_s2_mini
build_flags =
    ${esp32_common.build_flags}
    -DFW_BOARD=\"lolin_s2_mini\"
    -DLED_PIN=15
    -DLED_RGB=0

[env:esp32s3-debug]
; ESP32-S3 firmware with ESP-IDF/Arduino logs on the UART (COM) port:
;   pio run -e esp32s3-debug -t upload --upload-port COM6
;   pio device monitor -p COM6 -b 115200
extends = env:esp32s3
custom_dist = no
build_flags =
    ${env:esp32s3.build_flags}
    -DCORE_DEBUG_LEVEL=4

[env:native]
; Host-side unit tests for the protocol code (no board needed): pio test -e native
platform = native
test_build_src = no
build_flags = -std=c++17 -I src
